# Docker Compose for Task 4: Web Server using Docker
# Runs: web server + Nginx reverse proxy

version: '3.8'

networks:
  webnet:
    driver: bridge

volumes:
  nginx-logs:

services:
  # ────────────────────────────────────────────────────
  # Python Flask web server (app container)
  # ────────────────────────────────────────────────────
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: codealpha-webapp
    restart: unless-stopped
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - APP_VERSION=1.0.0
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Do not expose port directly; Nginx is the public-facing entry point
    expose:
      - "8080"

  # ────────────────────────────────────────────────────
  # Nginx reverse proxy
  # ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: codealpha-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      webapp:
        condition: service_healthy
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
